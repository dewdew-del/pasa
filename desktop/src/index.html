<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasa</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="main.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="head">
      <div class="word">Pasa</div>
      <div class="status"><span class="dot" id="dot"></span><span id="status">Waiting for phone</span></div>
    </div>

    <div class="qr-card">
      <div class="qr" id="qr" role="img" aria-label="QR code to connect your phone"></div>
      <h2>Scan with your phone</h2>
      <p id="noNet" hidden>No Wi-Fi. Join Wi-Fi or a hotspot.</p>
    </div>

    <div class="actions">
      <button class="btn primary" id="send"><svg class="i"><use href="#i-up"/></svg>Send files</button>
      <button class="btn" id="folder"><svg class="i"><use href="#i-folder"/></svg>Received</button>
    </div>

    <div class="list-box">
      <div class="list-head"><h2>Transfers</h2><span class="num" id="sum"></span></div>
      <div class="empty" id="empty">Drop files here</div>
      <ul class="list" id="list"></ul>
    </div>

    <div class="foot">
      <details>
        <summary>Can't connect?</summary>
        <ul>
          <li>Same Wi-Fi or hotspot</li>
          <li>Allow Pasa in Windows Firewall</li>
        </ul>
      </details>
      <button class="link" id="forget">Forget phones</button>
    </div>
  </div>
  <div class="drop" aria-hidden="true">Drop to send</div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4"/></symbol>
    <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 3v10M4 9l4 4 4-4"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
    <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2 4.5V12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H8L6.5 3H3a1 1 0 0 0-1 1.5z"/></symbol>
  </svg>
</body>
</html>
